name: Build Firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: main/http_server/axe-os/package-lock.json

      - name: Build web UI
        working-directory: ./main/http_server/axe-os
        run: |
          npm ci
          npm run build

      - name: Build ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          command: GITHUB_ACTIONS="true" idf.py build
          path: '.'

      - name: Install esptool
        run: pip install 'esptool>=4.8,<5'

      - name: Create factory image
        run: |
          chmod +x ./merge_bin.sh
          ./merge_bin.sh ./esp-miner-merged.bin

      - name: Upload factory image
        uses: actions/upload-artifact@v4
        with:
          name: esp-miner-factory.bin
          path: ./esp-miner-merged.bin
          if-no-files-found: error

      - name: Upload OTA firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-miner.bin
          path: ./build/esp-miner.bin
          if-no-files-found: error

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: www.bin
          path: ./build/www.bin
          if-no-files-found: error
